name: PRO MARKET international complet

on:
  push:
    branches:
      - feature/pro-market-international-complet-v1
    paths:
      - tools/pro-market-international-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pro-market-international-complet-v1
          fetch-depth: 0

      - name: Vérifier l'installateur
        run: python3 -m py_compile tools/install_pro_market_international.py

      - name: Installer le cockpit international
        run: python3 tools/install_pro_market_international.py

      - name: Vérifier JavaScript
        run: |
          node --check assets/js/pro-market-i18n-data.js
          node --check assets/js/pro-market-i18n.js

      - name: Vérifier les raccords
        run: |
          for f in index.html pin.html produits.html boutique.html fiche.html; do
            grep -q "amorce langue avant guard" "$f"
            grep -q "pro-market-i18n.js" "$f"
          done
          grep -q "DIGIY_PRO_MARKET_URL" pin.html
          grep -q "DIGIY_PRO_MARKET_LOGIN_URL" index.html
          grep -q "DIGIY_PRO_MARKET_LOGIN_URL" produits.html
          grep -q "DIGIY_PRO_MARKET_LOGIN_URL" boutique.html
          grep -q "DIGIY_PRO_MARKET_LOGIN_URL" fiche.html
          grep -q "market-qr-international-20260731" qr.html
          grep -q "target.searchParams.set(\"lang\",lang)" lang.html

      - name: Commit du résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pin.html produits.html boutique.html fiche.html lang.html qr.html
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer"
          else
            git commit -m "PRO MARKET : raccorder le cockpit aux sept langues"
            git push origin HEAD:feature/pro-market-international-complet-v1
          fi
